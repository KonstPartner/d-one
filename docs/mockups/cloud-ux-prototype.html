<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Diabetes Diary — Cloud UX Prototype</title>
  <style>
    :root {
      --canvas:#e9edf5;--canvas-grid:rgba(17,24,39,.035);--bg:#f7f8fb;--card:#fff;--header:rgba(255,255,255,.94);
      --text:#111827;--muted:#687386;--muted-2:#9aa3b2;--border:#dfe5ee;--input:#f0f3f8;--primary:#2563eb;
      --primary-2:#38bdf8;--primary-soft:#eaf2ff;--primary-border:#b9d1ff;--success:#16a34a;--success-soft:#ecfdf3;
      --warning:#d97706;--warning-soft:#fff7e8;--danger:#dc2626;--danger-soft:#fff1f2;--shadow:0 24px 60px rgba(15,23,42,.16);
      --shadow-soft:0 12px 30px rgba(15,23,42,.09);--phone-frame:#10131a;--phone-width:390px;--radius:16px;--radius-lg:22px;
      --metric-red:#ff6464;--metric-green:#70d36a;--metric-blue:#4c94ff;--metric-purple:#a16cff;
    }
    html[data-theme="dark"] {
      --canvas:#050815;--canvas-grid:rgba(255,255,255,.035);--bg:#07101e;--card:#0d1727;--header:rgba(7,16,30,.94);
      --text:#f7f9ff;--muted:#91a0bb;--muted-2:#61708a;--border:#24334c;--input:#101d30;--primary:#3b82f6;
      --primary-2:#38bdf8;--primary-soft:rgba(59,130,246,.13);--primary-border:rgba(96,165,250,.42);--success:#4ade80;
      --success-soft:rgba(74,222,128,.12);--warning:#f6ad3c;--warning-soft:rgba(245,158,11,.12);--danger:#fb7185;
      --danger-soft:rgba(244,63,94,.12);--shadow:0 30px 70px rgba(0,0,0,.5);--shadow-soft:0 16px 34px rgba(0,0,0,.28);--phone-frame:#01040a;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-width:320px;background:
      radial-gradient(circle at 14% 0%,rgba(37,99,235,.15),transparent 28rem),
      radial-gradient(circle at 90% 35%,rgba(56,189,248,.09),transparent 28rem),var(--canvas);
      color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}
    button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:default}.hidden{display:none!important}
    .prototype-shell{width:min(1320px,100%);margin:0 auto;padding:24px}.prototype-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
    .prototype-title{margin:0;font-size:clamp(24px,3vw,36px);letter-spacing:-.04em;line-height:1.1}.prototype-lead{margin:7px 0 0;color:var(--muted);font-size:14px}
    .prototype-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--primary-border);border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
    .prototype-badge:before{width:8px;height:8px;border-radius:50%;background:var(--primary);content:"";box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
    .control-deck{position:sticky;z-index:80;top:12px;display:grid;grid-template-columns:1.25fr 1.45fr .9fr .9fr;gap:12px;margin-bottom:22px}
    .control-panel{border:1px solid var(--border);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:var(--shadow-soft);padding:13px;backdrop-filter:blur(18px)}
    .control-panel__title{margin:0 0 9px;font-size:12px;font-weight:900}.segmented{display:flex;flex-wrap:wrap;gap:6px}.segment{min-height:36px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);padding:7px 10px;font-size:11px;font-weight:800}
    .segment:hover{border-color:var(--primary-border);background:var(--primary-soft)}.segment.is-active{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 22%,transparent)}
    .stage{min-height:800px;display:grid;place-items:start center;border:1px dashed var(--border);border-radius:30px;background:
      linear-gradient(color-mix(in srgb,var(--card) 52%,transparent),color-mix(in srgb,var(--card) 52%,transparent)),
      repeating-linear-gradient(0deg,transparent,transparent 31px,var(--canvas-grid) 32px),
      repeating-linear-gradient(90deg,transparent,transparent 31px,var(--canvas-grid) 32px);padding:24px 18px 34px;overflow:hidden}
    .phone{width:min(var(--phone-width),100%);min-height:760px;position:relative;overflow:hidden;border:10px solid var(--phone-frame);border-radius:42px;background:var(--bg);box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.14) inset}
    .phone:before{position:absolute;z-index:50;top:8px;left:50%;width:104px;height:26px;border-radius:999px;background:var(--phone-frame);content:"";transform:translateX(-50%)}
    .phone__screen{height:740px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.status-bar{flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 0;font-size:11px;font-weight:900}
    .status-icons{display:flex;gap:6px;align-items:center}.signal{display:flex;align-items:flex-end;gap:1px;height:10px}.signal i{display:block;width:2px;border-radius:2px;background:currentColor}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}.battery{width:18px;height:9px;border:1.5px solid currentColor;border-radius:2px;position:relative}.battery:before{position:absolute;right:-3px;top:2px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor;content:""}.battery:after{position:absolute;inset:1px;right:4px;border-radius:1px;background:currentColor;content:""}
    .app-header{flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:5px 14px 7px 18px;border-bottom:1px solid var(--border);background:var(--header);backdrop-filter:blur(15px);position:relative;z-index:20}.app-title{margin:0;font-size:21px;letter-spacing:-.025em}
    .icon-button{width:42px;height:42px;border:1px solid var(--border);border-radius:14px;display:inline-grid;place-items:center;background:var(--card);color:var(--text);transition:150ms ease}.icon-button:hover{border-color:var(--primary-border);background:var(--primary-soft)}.icon-button.ghost{border-color:transparent;background:transparent}.icon-button.small{width:34px;height:34px;border-radius:11px}.icon-button.primary{border-color:var(--primary);background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff}
    .header-menu{position:absolute;z-index:65;top:50px;right:12px;width:200px;border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:var(--shadow-soft);padding:7px;display:none}.header-menu.is-open{display:block;animation:pop .14s ease-out}.menu-item{width:100%;min-height:40px;display:flex;align-items:center;gap:10px;border:0;border-radius:10px;background:transparent;color:var(--text);padding:8px 10px;text-align:left;font-size:13px;font-weight:800}.menu-item:hover{background:var(--input)}
    .screen-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.cloud-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.content{padding:12px 13px 16px}.loading-strip{height:3px;background:transparent;overflow:hidden}.loading-strip.is-visible:after{display:block;width:45%;height:100%;background:linear-gradient(90deg,transparent,var(--primary),transparent);content:"";animation:loadLine 1s linear infinite}
    .mode-note{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:9px 10px;border:1px solid var(--primary-border);border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800}.mode-note svg{flex:0 0 auto}
    .day-group{margin-bottom:12px}.day-header{width:100%;min-height:38px;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:var(--text);padding:5px 2px;font-size:13px;font-weight:900}.day-header__left{display:flex;gap:7px;align-items:center}.day-header__chevron{width:18px;color:var(--muted);transition:transform .15s ease}.day-group.is-collapsed .day-header__chevron{transform:rotate(-90deg)}.day-header__count{color:var(--muted);font-size:11px;font-weight:800}.day-cards{display:grid;gap:11px}.day-group.is-collapsed .day-cards{display:none}
    .cloud-card{position:relative;border:1px solid var(--border);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 98%,transparent),color-mix(in srgb,var(--card) 92%,var(--primary-soft)));box-shadow:0 14px 30px rgba(2,8,23,.13);overflow:hidden;transition:180ms ease}.cloud-card:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));transform:translateY(-1px)}.cloud-card.is-selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}

<body>

          <header class="app-header">

              <button class="menu-item owner-only" data-menu-action="select"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="m15 18 2 2 4-5"/></svg>Select entries</button>

<script>
(() => {
'use strict';
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)]; const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const icon={
 clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 meal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M17 3v18M17 3c3 2 3 7 0 9"/></svg>',
 glucose:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3S6 10 6 15a6 6 0 0 0 12 0c0-5-6-12-6-12Z"/></svg>',
 carbs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V8M12 12C8 12 6 9 6 6c4 0 6 3 6 6ZM12 15c4 0 6-3 6-6-4 0-6 3-6 6ZM12 18c-3 0-5-2-5-5 3 0 5 2 5 5Z"/></svg>',
 short:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 3 7 7M12 5l7 7-9 9-7-7 9-9ZM5 12l7 7M16 2l6 6"/></svg>',
 long:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 7v5c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-5"/></svg>',
 comment:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"/></svg>',
 ai:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg>'
};
const pages=[
 [
  {id:'c1',day:'2026-07-25',time:'13:05',glucose:7.4,carbs:35,short:4,long:null,meal:'Before meal',comment:'Lunch: buckwheat, chicken and vegetables. Portion looked slightly larger than usual.',ai:'Food: buckwheat with chicken and vegetables\nCalories: 420–580 kcal\nProtein: 25–38 g\nFat: 12–22 g\nCarbohydrates: 45–65 g\nConfidence: medium',photo:true},
  {id:'c2',day:'2026-07-25',time:'08:15',glucose:6.8,carbs:null,short:null,long:12,meal:'Fasting',comment:'Morning measurement before breakfast.',ai:'',photo:false},
  {id:'c3',day:'2026-07-24',time:'19:40',glucose:6.1,carbs:42,short:3,long:null,meal:'Before meal',comment:'Dinner at home.',ai:'Food: salmon, potatoes and salad\nCalories: 510–680 kcal\nProtein: 32–46 g\nFat: 20–34 g\nCarbohydrates: 38–55 g',photo:true,alt:true}
 ],
 [
  {id:'c4',day:'2026-07-23',time:'22:25',glucose:5.7,carbs:null,short:null,long:10,meal:'Bedtime',comment:'Evening measurement.',ai:'',photo:false},
  {id:'c5',day:'2026-07-23',time:'15:18',glucose:9.2,carbs:null,short:null,long:null,meal:'After meal',comment:'Higher than expected after lunch.',ai:'',photo:false}
 ]
];
const state={mode:'owner',dataset:'populated',network:'online',page:0,selection:false,selected:new Set(),collapsed:new Set(),loading:false,downloadStep:'strategy',conflictIndex:0,downloadResult:null};
function setActive(group,value){$$(`[data-control="${group}"] .segment`).forEach(b=>b.classList.toggle('is-active',b.dataset.value===value));}
function formatDay(day){return new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(new Date(day+'T12:00:00'));}
function currentEntries(){return pages[state.page]||[];}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function openOverlay(id){$('#'+id).classList.add('is-open');$('#'+id).setAttribute('aria-hidden','false');}
function closeOverlay(id){$('#'+id).classList.remove('is-open');$('#'+id).setAttribute('aria-hidden','true');}
function showToast(message,tone=''){const el=document.createElement('div');el.className='toast '+tone;el.textContent=message;$('#toastStack').appendChild(el);setTimeout(()=>el.remove(),2600);}
function renderTabs(){const owner=state.mode==='owner';const tabs=owner?[
 ['Diary','<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>',false],['Cloud','<path d="M7 18a4 4 0 1 1 .9-7.9A6 6 0 0 1 19.7 12 3 3 0 0 1 19 18H7Z"/>',true],['Profile','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',false]
 ]:[['Diary','<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>',true],['Profile','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',false]];
 $('#tabBar').className='tab-bar '+(owner?'owner':'follower');$('#tabBar').innerHTML=tabs.map(([label,path,active])=>`<button class="tab ${active?'is-active':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>${label}</button>`).join('');
}
function render(){
 const owner=state.mode==='owner';document.documentElement.dataset.mode=state.mode;$('#appTitle').textContent=owner?'Cloud':'Diary';
 $$('.owner-only').forEach(el=>el.classList.toggle('hidden',!owner));$$('.follower-only').forEach(el=>el.classList.toggle('hidden',owner));
 $('#selectionPanel').classList.toggle('is-visible',state.selection);$('#contentRoot').classList.toggle('selection-mode',state.selection);renderTabs();updateSelectionPanel();
 if(state.dataset!=='populated'){renderState();return;} renderList();
}
function renderState(){
 const owner=state.mode==='owner';let title='',copy='',danger=false;
 if(state.dataset==='empty'){title=owner?'No cloud entries yet':'No diary entries yet';copy=owner?'Synchronized entries will appear here.':'The followed diary has no entries yet.';}
 if(state.dataset==='error'){title=owner?'Failed to load cloud entries':'Failed to load diary';copy='The current page could not be loaded.';danger=true;}
 if(state.dataset==='unassigned'){title='No user assigned to follow';copy='No diary request is made until a user is assigned.';}
 if(state.dataset==='denied'){title='Diary access not granted';copy='The relationship does not grant read access.';danger=true;}
 const iconMarkup=danger?'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/>':'<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>';
 $('#listRoot').innerHTML=`<div class="state-card"><div class="state-icon ${danger?'danger':''}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconMarkup}</svg></div><h3 class="state-title">${title}</h3><p class="state-copy">${copy}</p>${state.dataset==='error'?'<button class="action-button primary" id="stateRetry">Retry</button>':''}</div>`;
 const retry=$('#stateRetry');if(retry)retry.addEventListener('click',manualRefresh);
}
function renderList(){
 const entries=currentEntries();const groups=new Map();entries.forEach(e=>{if(!groups.has(e.day))groups.set(e.day,[]);groups.get(e.day).push(e)});
 $('#listRoot').innerHTML=[...groups.entries()].map(([day,items])=>`<section class="day-group ${state.collapsed.has(day)?'is-collapsed':''}"><button class="day-header" data-day="${day}" ${state.selection?'disabled':''}><span class="day-header__left"><svg class="day-header__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m6 9 6 6 6-6"/></svg>${formatDay(day)}</span><span class="day-header__count">${items.length} ${items.length===1?'entry':'entries'}</span></button><div class="day-cards">${items.map(cardMarkup).join('')}</div></section>`).join('')+`<nav class="pagination ${state.selection?'hidden':''}"><button class="page-button" id="prevPage" ${state.page===0?'disabled':''}>Previous</button><button class="page-button" id="nextPage" ${state.page>=pages.length-1?'disabled':''}>Next</button></nav>`;
 $$('[data-day]').forEach(btn=>btn.addEventListener('click',()=>{const day=btn.dataset.day;if(state.selection)return;state.collapsed.has(day)?state.collapsed.delete(day):state.collapsed.add(day);renderList();}));
 $$('.cloud-card').forEach(bindCard);const prev=$('#prevPage'),next=$('#nextPage');if(prev)prev.addEventListener('click',previousPage);if(next)next.addEventListener('click',nextPage);
}
function cardMarkup(e){
 const metrics=[e.glucose!=null?metric('glucose',icon.glucose,e.glucose):'',e.carbs!=null?metric('carbs',icon.carbs,e.carbs):'',e.short!=null?metric('short',icon.short,e.short):'',e.long!=null?metric('long',icon.long,e.long):''].filter(Boolean).join('');
 return `<article class="cloud-card ${state.selected.has(e.id)?'is-selected':''}" data-id="${e.id}"><span class="select-check">✓</span><div class="cloud-card__main">${e.photo?`<button class="cloud-photo ${e.alt?'alt':''}" data-photo="${e.id}"><span class="photo-error">Photo unavailable</span></button>`:''}<div class="card-body"><div class="meta-row"><span class="time-meta">${icon.clock}<strong>${e.time}</strong><span class="date-meta">${formatDay(e.day)}</span></span>${e.meal?`<span class="meal-tag">${icon.meal}${e.meal}</span>`:''}</div>${metrics?`<div class="metric-grid">${metrics}</div>`:''}${e.comment?readRow('comment',e.id,e.comment):''}${e.ai?readRow('ai',e.id,e.ai):''}</div></div></article>`;
}
function metric(type,svg,value){return `<span class="metric ${type}">${svg}<strong>${value}</strong></span>`;}
function readRow(type,id,text){const title=type==='ai'?'AI analysis':'Comment';return `<button class="read-row ${type==='ai'?'ai':''}" data-more="${type}" data-id="${id}"><span class="read-row__icon">${type==='ai'?icon.ai:icon.comment}</span><span><span class="read-row__title">${title}</span><span class="read-row__copy">${escapeHtml(text.replace(/\n/g,' · '))}</span></span><span class="read-row__chevron">›</span></button>`;}
function bindCard(card){const id=card.dataset.id;const e=currentEntries().find(x=>x.id===id);card.addEventListener('click',ev=>{if(ev.target.closest('[data-photo],[data-more]'))return;if(state.selection)toggleSelection(id)});const photo=$('[data-photo]',card);if(photo)photo.addEventListener('click',ev=>{ev.stopPropagation();if(state.selection)return toggleSelection(id);openOverlay('photoOverlay')});$$('[data-more]',card).forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();if(state.selection)return toggleSelection(id);const key=btn.dataset.more;$('#textTitle').textContent=key==='ai'?'AI analysis':'Comment';$('#textContent').textContent=e[key];openOverlay('textOverlay')}));}
function toggleSelection(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render();}
function updateSelectionPanel(){const count=state.selected.size;$('#selectionCount').textContent=`${count} selected`;$('#downloadButton').disabled=count===0;const entries=currentEntries();const all=entries.length&&entries.every(e=>state.selected.has(e.id));$('#selectAllButton').textContent=all?'Clear all':'Select all';}
function enterSelection(){if(state.mode!=='owner'||state.dataset!=='populated')return;state.selection=true;state.selected.clear();state.collapsed.clear();render();}
function exitSelection(){state.selection=false;state.selected.clear();render();}
async function manualRefresh(){if(state.network==='offline'){showToast('Refresh requires a network connection.','error');return;}closeMenu();state.loading=true;$('#loadingStrip').classList.add('is-visible');await wait(700);state.loading=false;state.page=0;state.collapsed.clear();$('#loadingStrip').classList.remove('is-visible');if(state.dataset==='error')state.dataset='populated';setActive('dataset',state.dataset);render();showToast('List refreshed.','success');}
async function nextPage(){if(state.network==='offline'){showToast('The next page is not loaded. Connect to the internet.','error');return;}$('#loadingStrip').classList.add('is-visible');await wait(600);state.page=Math.min(state.page+1,pages.length-1);state.collapsed.clear();$('#loadingStrip').classList.remove('is-visible');$('#cloudScroll').scrollTop=0;render();}
function previousPage(){state.page=Math.max(0,state.page-1);state.collapsed.clear();$('#cloudScroll').scrollTop=0;render();}
function closeMenu(){$('#headerMenu').classList.remove('is-open');$('#menuButton').setAttribute('aria-expanded','false');}
function startDownload(){if(state.network==='offline'){showToast('Download requires a network connection.','error');return;}state.downloadStep='strategy';renderDownload();openOverlay('downloadOverlay');}
function renderDownload(){const body=$('#downloadBody'),footer=$('#downloadFooter'),title=$('#downloadTitle'),back=$('#downloadBack'),close=$('#downloadClose');footer.classList.add('hidden');back.classList.add('hidden');close.classList.remove('hidden');title.textContent='Download entries';
 if(state.downloadStep==='strategy'){body.innerHTML=`<div class="mode-note">${state.selected.size} cloud ${state.selected.size===1?'entry':'entries'} selected</div><div class="choice-grid"><button class="choice-card" data-strategy="skip"><strong>Skip all conflicts</strong><span>Only entries that do not exist locally will be added.</span></button><button class="choice-card" data-strategy="replace"><strong>Replace all conflicts</strong><span>The cloud version fully replaces each local version.</span></button><button class="choice-card" data-strategy="review"><strong>Review individually</strong><span>Compare cloud and local versions before writing.</span></button></div>`;$$('[data-strategy]').forEach(b=>b.addEventListener('click',()=>chooseStrategy(b.dataset.strategy)));return;}
 if(state.downloadStep==='review'){title.textContent='Resolve conflict';back.classList.remove('hidden');const selected=[...state.selected];const id=selected[state.conflictIndex]||selected[0];const e=currentEntries().find(x=>x.id===id)||currentEntries()[0];body.innerHTML=`<div class="mode-note">Conflict ${state.conflictIndex+1} of ${Math.max(1,Math.min(2,selected.length))}</div><div class="compare-card"><span class="compare-label">Cloud entry</span><h4 class="compare-title">${e.time} · ${e.meal||'No meal relation'}</h4><p class="compare-copy">Glucose ${e.glucose??'—'} · Carbs ${e.carbs??'—'} · ${escapeHtml(e.comment||'No comment')}</p></div><div class="compare-card"><span class="compare-label local">Local entry</span><h4 class="compare-title">${e.time} · Existing local version</h4><p class="compare-copy">Glucose ${(e.glucose??0)+.5} · Local comment and unsynchronized changes may differ.</p></div><div class="dialog-actions"><button class="action-button secondary grow" data-review="skip">Skip</button><button class="action-button primary grow" data-review="replace">Replace</button></div>`;$$('[data-review]').forEach(b=>b.addEventListener('click',()=>reviewDecision(b.dataset.review)));return;}
 if(state.downloadStep==='progress'){title.textContent='Downloading';close.classList.add('hidden');body.innerHTML='<div class="progress-card"><div class="progress-spinner"></div><h3 style="margin:0 0 5px">Saving cloud entries locally</h3><p style="margin:0;color:var(--muted);font-size:11px">Photos remain cloud-only. Each entry is processed independently.</p></div>';runDownload();return;}
 if(state.downloadStep==='result'){title.textContent='Download complete';const r=state.downloadResult;body.innerHTML=`<div class="result-grid"><div class="result-item"><span>Added</span><strong>${r.added}</strong></div><div class="result-item"><span>Replaced</span><strong>${r.replaced}</strong></div><div class="result-item"><span>Skipped</span><strong>${r.skipped}</strong></div><div class="result-item"><span>Errors</span><strong>${r.failed}</strong></div></div><p style="color:var(--muted);font-size:11px">The cloud page stays open. No automatic upload starts.</p>`;footer.classList.remove('hidden');footer.innerHTML='<button class="action-button primary grow" id="downloadDone">Done</button>';$('#downloadDone').addEventListener('click',finishDownload);}
}
function chooseStrategy(strategy){if(strategy==='review'){state.downloadStep='review';state.conflictIndex=0;renderDownload();return;}state.downloadStrategy=strategy;state.downloadStep='progress';renderDownload();}
function reviewDecision(decision){state.conflictIndex++;if(state.conflictIndex<Math.max(1,Math.min(2,state.selected.size))){renderDownload();return;}state.downloadStrategy=decision==='replace'?'reviewReplace':'reviewSkip';state.downloadStep='progress';renderDownload();}
async function runDownload(){await wait(1200);const count=state.selected.size;let result;if(state.downloadStrategy==='skip')result={added:Math.max(0,count-2),replaced:0,skipped:Math.min(2,count),failed:0};else if(state.downloadStrategy==='replace')result={added:Math.max(0,count-2),replaced:Math.min(2,count),skipped:0,failed:0};else if(state.downloadStrategy==='reviewSkip')result={added:Math.max(0,count-1),replaced:0,skipped:Math.min(1,count),failed:0};else result={added:Math.max(0,count-1),replaced:Math.min(1,count),skipped:0,failed:0};state.downloadResult=result;state.downloadStep='result';renderDownload();}
function finishDownload(){closeOverlay('downloadOverlay');exitSelection();showToast('Entries downloaded to the local diary.','success');}
$$('[data-control="mode"] .segment').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.value;state.selection=false;state.selected.clear();state.page=0;if(state.mode==='owner'&&['unassigned','denied'].includes(state.dataset))state.dataset='populated';setActive('mode',state.mode);setActive('dataset',state.dataset);render();}));
$$('[data-control="dataset"] .segment').forEach(b=>b.addEventListener('click',()=>{state.dataset=b.dataset.value;state.selection=false;state.selected.clear();state.page=0;setActive('dataset',state.dataset);render();}));
$$('[data-control="network"] .segment').forEach(b=>b.addEventListener('click',()=>{state.network=b.dataset.value;setActive('network',state.network);$('#networkStatus').textContent=state.network==='online'?'5G':'Offline';showToast(state.network==='online'?'Connection restored.':'Offline. Existing cloud pages remain visible.',state.network==='online'?'success':'');}));
$$('[data-control="theme"] .segment').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.value;setActive('theme',b.dataset.value)}));
$('#menuButton').addEventListener('click',()=>{const open=$('#headerMenu').classList.toggle('is-open');$('#menuButton').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.app-header'))closeMenu()});
$$('[data-menu-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.menuAction;closeMenu();if(a==='refresh')manualRefresh();if(a==='select')enterSelection()}));
$('#selectAllButton').addEventListener('click',()=>{const entries=currentEntries();const all=entries.length&&entries.every(e=>state.selected.has(e.id));state.selected=all?new Set():new Set(entries.map(e=>e.id));render()});$('#closeSelectionButton').addEventListener('click',exitSelection);$('#downloadButton').addEventListener('click',startDownload);
$$('[data-close-overlay]').forEach(b=>b.addEventListener('click',()=>closeOverlay(b.dataset.closeOverlay)));$('#viewerImage').addEventListener('dblclick',()=>$('#viewerImage').classList.toggle('is-zoomed'));$('#downloadClose').addEventListener('click',()=>closeOverlay('downloadOverlay'));$('#downloadBack').addEventListener('click',()=>{state.downloadStep='strategy';renderDownload()});
render();
})();
</script>
</body></html>
